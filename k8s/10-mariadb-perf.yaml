# Réplica de kiwi-mariadb (copiada de producción; solo cambian nombres, etiquetas, secret y PVC).
# Las etiquetas NO deben coincidir con el selector de producción (instance=kiwi, name=mariadb).
apiVersion: v1
kind: Service
metadata:
  name: kiwi-perf-mariadb
  namespace: kiwi
  labels:
    app.kubernetes.io/name: kiwi-perf-mariadb
    app.kubernetes.io/instance: kiwi-perf
    app.kubernetes.io/part-of: kiwi-perf
spec:
  type: ClusterIP
  ports:
  - name: mysql
    port: 3306
    protocol: TCP
    targetPort: mysql
  selector:
    app.kubernetes.io/name: kiwi-perf-mariadb
    app.kubernetes.io/instance: kiwi-perf
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kiwi-perf-mariadb
  namespace: kiwi
  labels:
    app.kubernetes.io/name: kiwi-perf-mariadb
    app.kubernetes.io/instance: kiwi-perf
    app.kubernetes.io/part-of: kiwi-perf
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  serviceName: kiwi-perf-mariadb
  selector:
    matchLabels:
      app.kubernetes.io/name: kiwi-perf-mariadb
      app.kubernetes.io/instance: kiwi-perf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kiwi-perf-mariadb
        app.kubernetes.io/instance: kiwi-perf
        app.kubernetes.io/part-of: kiwi-perf
    spec:
      nodeSelector:
        kubernetes.io/hostname: asic-x86-02
      containers:
      - name: mariadb
        image: docker.io/library/mariadb:11.3@sha256:e101f9db31916a5d4d7d594dd0dd092fb23ab4f499f1d7a7425d1afd4162c4bc
        imagePullPolicy: IfNotPresent
        args:
        - --character-set-server=utf8mb3
        - --collation-server=utf8mb3_general_ci
        - --skip-name-resolve
        - --explicit-defaults-for-timestamp
        - --max-allowed-packet=16M
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: mariadb-root-password
              name: kiwi-perf-credentials
        - name: MARIADB_USER
          valueFrom:
            secretKeyRef:
              key: mariadb-username
              name: kiwi-perf-credentials
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: mariadb-password
              name: kiwi-perf-credentials
        - name: MARIADB_DATABASE
          value: kiwi
        livenessProbe:
          exec:
            command:
            - healthcheck.sh
            - --connect
          failureThreshold: 6
          initialDelaySeconds: 120
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - healthcheck.sh
            - --connect
            - --innodb_initialized
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        ports:
        - containerPort: 3306
          name: mysql
          protocol: TCP
        resources:
          limits:
            cpu: "6"
            memory: 12Gi
          requests:
            cpu: "1"
            memory: 3Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/mysql
          name: mariadb-data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsUser: 999
      terminationGracePeriodSeconds: 30
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: mariadb-data
      labels:
        app.kubernetes.io/name: kiwi-perf-mariadb
        app.kubernetes.io/instance: kiwi-perf
        app.kubernetes.io/part-of: kiwi-perf
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 32Gi
      storageClassName: hpe-standard
      volumeMode: Filesystem
